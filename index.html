      <li>
        <a class="trabalho${animar ? " surgir" : ""}" href="${esc(v.link)}" target="_blank" rel="noopener noreferrer" data-video="${v.id}" data-titulo="${esc(v.marca + ": " + v.titulo)}">
          <div class="moldura">
            ${capaDoVideo(v.id, `${T.capaVideo} ${v.marca}: ${v.titulo}`)}
            <span class="mini-play">${icones.play}</span>
          </div>
          <div class="trabalho-legenda">
            <p class="trabalho-marca">${esc(v.marca)}</p>
            <p class="trabalho-titulo">${esc(v.titulo)}</p>
          </div>
        </a>
      </li>`;
    }

    // Mostrando todos: cada nicho vira uma linha com título; com mais de 5 vídeos,
    // a linha rola para o lado e ganha setas.
    const VIDEOS_POR_LINHA = 5;
    const seta = (lado) => `<button type="button" class="nicho-seta" data-lado="${lado}" aria-label="${lado < 0 ? T.anterior : T.proximo}"${lado < 0 ? " disabled" : ""}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="${lado < 0 ? "m15 6-6 6 6 6" : "m9 6 6 6-6 6"}"/></svg></button>`;

    function atualizarSetas(trilho) {
      const linha = trilho.closest(".nicho-linha");
      const ant = linha.querySelector('[data-lado="-1"]');
      const prox = linha.querySelector('[data-lado="1"]');
      if (!ant) return;
      ant.disabled = trilho.scrollLeft <= 4;
      prox.disabled = trilho.scrollLeft + trilho.clientWidth >= trilho.scrollWidth - 4;
    }

    function desenharGaleria(desde) {
      if (filtroAtual === "*") {
        galeria.classList.add("em-linhas");
        galeria.innerHTML = nichos.map((n) => {
          const vids = todosVideos.filter((v) => v.nicho === n.nome);
          const rola = vids.length > VIDEOS_POR_LINHA;
          return `
          <li class="nicho-linha">
            <div class="galeria-titulo"><h3>${esc(n.nome)}</h3><span>${vids.length}</span>${rola ? `<div class="nicho-setas">${seta(-1)}${seta(1)}</div>` : ""}</div>
            <ul class="nicho-trilho">${vids.map((v) => cardTrabalho(v, false)).join("")}</ul>
          </li>`;
        }).join("");
        galeria.querySelectorAll(".nicho-trilho").forEach((t) => {
          t.addEventListener("scroll", () => atualizarSetas(t), { passive: true });
          atualizarSetas(t);
        });
        verMais.hidden = true;
        return;
      }
      galeria.classList.remove("em-linhas");
      const lista = videosDoFiltro();
      const visiveis = lista.slice(0, limite);
      if (desde > 0) {
        galeria.insertAdjacentHTML("beforeend", visiveis.slice(desde).map((v) => cardTrabalho(v, true)).join(""));
      } else {
        galeria.innerHTML = visiveis.map((v) => cardTrabalho(v, true)).join("");
      }
      const restam = lista.length - visiveis.length;
      verMais.hidden = restam <= 0;
      verMais.textContent = T.verMaisVideos(restam);
    }

    const filtros = $("#filtros");
    filtros.innerHTML = nichos
      .map((n) => `<button type="button" class="filtro" data-filtro="${esc(n.nome)}" aria-pressed="false">${esc(n.nome)} <small aria-hidden="true">${n.videos.length}</small></button>`)
      .join("");

    // Clicar num nicho mostra só ele; clicar de novo no mesmo volta a mostrar todos.
    filtros.addEventListener("click", (evento) => {
      const botao = evento.target.closest(".filtro");
      if (!botao) return;
      filtroAtual = filtroAtual === botao.dataset.filtro ? "*" : botao.dataset.filtro;
      if (filtroAtual === "*") {
        limite = porPagina;
        filtros.querySelectorAll(".filtro").forEach((b) => b.setAttribute("aria-pressed", "false"));
        desenharGaleria(0);
        $("#filtro-aviso").textContent = T.mostrandoTodos(todosVideos.length);
        return;
      }
      limite = porPagina;
      filtros.querySelectorAll(".filtro").forEach((b) => b.setAttribute("aria-pressed", String(b === botao)));
      desenharGaleria(0);
      const total = videosDoFiltro().length;
      const nomeFiltro = botao.firstChild.textContent.trim();
      $("#filtro-aviso").textContent = filtroAtual === "*"
        ? T.mostrandoTodos(total)
        : T.mostrando(total, nomeFiltro);
    });

    verMais.addEventListener("click", () => {
      const antes = limite;
      limite += porPagina;
      desenharGaleria(antes);
      const primeiroNovo = galeria.querySelectorAll(".trabalho")[antes];
      if (primeiroNovo) primeiroNovo.focus({ preventScroll: true });
    });

    galeria.addEventListener("click", (e) => {
      const b = e.target.closest(".nicho-seta");
      if (!b) return;
      const trilho = b.closest(".nicho-linha").querySelector(".nicho-trilho");
      trilho.scrollBy({ left: Number(b.dataset.lado) * trilho.clientWidth * 0.8, behavior: reduzirMovimento ? "auto" : "smooth" });
    });
    window.addEventListener("resize", () => galeria.querySelectorAll(".nicho-trilho").forEach(atualizarSetas));

    desenharGaleria(0);

    /* ---------- YouTube e TikTok Shop ---------- */
    $("#youtube-videos").innerHTML = CONFIG.youtube.videos.map((v) => {
      const id = idDoVideo(v.link);
      return `
      <a class="video-longo" href="${esc(v.link)}" target="_blank" rel="noopener noreferrer" data-video="${id}" data-formato="horizontal" data-titulo="${esc(v.titulo)}">
        <div class="capa-16x9">
          <img class="midia" src="capas/${id}.jpg" alt="${esc(`${T.capaVideo} ${v.marca}: ${v.titulo}`)}" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='https://i.ytimg.com/vi/${id}/hqdefault.jpg'">
          <span class="card-selo">YouTube</span>
          <span class="play">${icones.play}</span>
        </div>
        <div class="video-longo-legenda"><strong>${esc(v.titulo)}</strong><span>${esc(v.marca)}</span></div>
      </a>`;
    }).join("");
    $("#tiktok-itens").innerHTML = CONFIG.tiktokShop.itens.map((t) => `<li>${icones.check}<span>${esc(t)}</span></li>`).join("");
    const linkTiktok = $("#tiktok-link");
    linkTiktok.href = CONFIG.tiktokShop.link;
    linkTiktok.innerHTML = `${esc(CONFIG.tiktokShop.botao)} <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg><span class="visualmente-oculto"> ${T.novaAba}</span>`;

    /* ---------- Player de vídeo ---------- */
    const player = $("#player");
    function abrirVideo(id, titulo, formato) {
      $("#player-video").classList.toggle("horizontal", formato === "horizontal");
      $("#player-video").innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0&playsinline=1&cc_load_policy=0&iv_load_policy=3&hl=${T.locale}" title="${esc(titulo)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
      player.showModal();
    }
    document.addEventListener("click", (evento) => {
      const link = evento.target.closest("[data-video]");
      if (!link || !link.dataset.video || typeof player.showModal !== "function") return;
      if (evento.ctrlKey || evento.metaKey || evento.shiftKey || evento.button === 1) return;
      evento.preventDefault();
      abrirVideo(link.dataset.video, link.dataset.titulo, link.dataset.formato);
    });
    $("#player-fechar").addEventListener("click", () => player.close());
    player.addEventListener("click", (evento) => { if (evento.target === player) player.close(); });
    player.addEventListener("close", () => { $("#player-video").innerHTML = ""; });

    /* ---------- Serviços ---------- */
    $("#servicos-lista").innerHTML = CONFIG.servicos.itens.map((s, i) => `
      <li class="reveal" style="--atraso:${(i % 3) * 100}ms">
        <article class="servico">
          <span class="servico-numero" aria-hidden="true">${String(i + 1).padStart(2, "0")}</span>
          <h3>${esc(s.titulo)}</h3>
          <p>${esc(s.descricao)}</p>
          <p class="servico-detalhe">${esc(s.detalhe)}</p>
        </article>
      </li>`).join("");

    /* ---------- Números ---------- */
    const formatar = (n, casas) => n.toLocaleString(T.locale, { minimumFractionDigits: casas, maximumFractionDigits: casas });

    $("#contadores").innerHTML = CONFIG.numeros.contadores.map((c, i) => `
      <li class="contador reveal" style="--atraso:${i * 100}ms">
        <span class="contador-valor" aria-hidden="true">${esc(c.prefixo)}<span class="contador-num" data-valor="${c.valor}" data-casas="${c.casas || 0}">${formatar(0, c.casas || 0)}</span><span class="sufixo">${esc(c.sufixo)}</span></span>
        <span class="visualmente-oculto">${esc(c.prefixo)}${formatar(c.valor, c.casas || 0)}${esc(c.sufixo)}</span>
        <span class="contador-rotulo">${esc(c.rotulo)}</span>
      </li>`).join("");

    /* ---------- Parede de logos: todas paradas e à vista, as mais conhecidas primeiro ---------- */
    const selos = CONFIG.marcas.semLogo.map((nome) => ({ nome, cor: "" }));
    function itemLogo(m) {
      if (m.logo) return `<li class="logo-item"><img src="${esc(versao(m.logo))}" alt="${m.nome === "Marca parceira" ? T.logoParceira : T.logo + " " + esc(m.nome)}" loading="lazy" decoding="async" width="100" height="100"></li>`;
      return `<li class="logo-item logo-texto ${m.cor}">${esc(m.nome)}</li>`;
    }
    $("#logos-grade").innerHTML = conhecidas.concat(demais, selos).map(itemLogo).join("");

    /* ---------- Resultados e depoimentos ---------- */
    const depVisiveis = CONFIG.numeros.depoimentosVisiveis || CONFIG.numeros.depoimentos.length;
    $("#depoimentos").innerHTML = CONFIG.numeros.depoimentos.map((d, i) => `
      <li class="reveal" style="--atraso:${(i % 4) * 90}ms"${i >= depVisiveis ? " hidden" : ""}>
        <figure class="depoimento">
          <p class="estrelas"><span aria-hidden="true">★★★★★</span><span class="visualmente-oculto">${T.nota}</span></p>
          <blockquote><p>${esc(d.texto)}</p></blockquote>
          <figcaption>
            <span class="avatar" aria-hidden="true">${d.logo ? `<img src="${esc(versao(d.logo))}" alt="" loading="lazy">` : esc(d.empresa.charAt(0))}</span>
            <span><span class="depoimento-nome">${esc(d.empresa)}</span><span class="depoimento-empresa">${esc(d.nome)}</span></span>
          </figcaption>
        </figure>
      </li>`).join("");
    const maisDep = $("#mais-depoimentos");
    const escondidos = CONFIG.numeros.depoimentos.length - depVisiveis;
    maisDep.hidden = escondidos <= 0;
    maisDep.textContent = T.verMaisDep(escondidos);
    maisDep.addEventListener("click", () => {
      const itens = [...document.querySelectorAll("#depoimentos > li[hidden]")];
      itens.forEach((li) => { li.hidden = false; li.classList.add("visivel"); });
      maisDep.hidden = true;
      if (itens[0]) { const f = itens[0].querySelector("figure"); f.tabIndex = -1; f.focus({ preventScroll: true }); }
    });

    function animarContador(el) {
      const alvo = parseFloat(el.dataset.valor);
      const casas = parseInt(el.dataset.casas, 10);
      if (reduzirMovimento) { el.textContent = formatar(alvo, casas); return; }
      const duracao = 1800;
      const inicio = performance.now();
      function passoAnim(agora) {
        const t = Math.min((agora - inicio) / duracao, 1);
        const suave = 1 - Math.pow(1 - t, 3);
        el.textContent = formatar(alvo * suave, casas);
        if (t < 1) requestAnimationFrame(passoAnim);
      }
      requestAnimationFrame(passoAnim);
    }

    /* ---------- Contato ---------- */
    const ct = CONFIG.contato;
    let digitosWhats = ct.whatsapp.replace(/\D/g, "");
    if (!digitosWhats.startsWith("55") || digitosWhats.length <= 11) digitosWhats = "55" + digitosWhats;
    const linkWhats = `https://wa.me/${digitosWhats}?text=${encodeURIComponent(ct.mensagemWhatsApp)}`;
    const linkInsta = `https://www.instagram.com/${ct.instagram.replace("@", "")}/`;

    $("#contato-links").innerHTML = [
      { icone: icones.whatsapp, rotulo: "WhatsApp", valor: ct.whatsapp, link: linkWhats, externo: true },
      { icone: icones.email, rotulo: "E-mail", valor: ct.email, link: `mailto:${ct.email}`, externo: false },
      { icone: icones.instagram, rotulo: "Instagram", valor: ct.instagram, link: linkInsta, externo: true },
      { icone: icones.tiktok, rotulo: "TikTok", valor: ct.tiktok, link: `https://www.tiktok.com/${ct.tiktok}`, externo: true }
    ].map((c, i) => `
      <li class="reveal" style="--atraso:${i * 90}ms">
        <a class="contato-link" href="${esc(c.link)}" ${c.externo ? 'target="_blank" rel="noopener noreferrer"' : ""}>
          <span class="contato-icone">${c.icone}</span>
          <span><small>${c.rotulo}</small><strong>${esc(c.valor)}</strong></span>
          ${c.externo ? `<span class="visualmente-oculto">${T.novaAba}</span>` : ""}
        </a>
      </li>`).join("");

    const form = $("#formulario");
    const regras = [
      { id: "nome",     valida: (v) => v.trim().length >= 2, erro: T.erroNome },
      { id: "email",    valida: (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim()), erro: T.erroEmail },
      { id: "mensagem", valida: (v) => v.trim().length >= 10, erro: T.erroMensagem }
    ];

    form.addEventListener("submit", (evento) => {
      evento.preventDefault();
      let primeiroErro = null;
      regras.forEach((r) => {
        const campo = document.getElementById(r.id);
        const ok = r.valida(campo.value);
        campo.setAttribute("aria-invalid", String(!ok));
        document.getElementById("erro-" + r.id).textContent = ok ? "" : r.erro;
        if (!ok && !primeiroErro) primeiroErro = campo;
      });
      if (primeiroErro) { primeiroErro.focus(); return; }

      const nome = form.nome.value.trim();
      const email = form.email.value.trim();
      const mensagem = form.mensagem.value.trim();

      if (ct.modoFormulario === "mailto") {
        const corpo = `${T.emailNome}: ${nome}\n${T.emailEmail}: ${email}\n\n${mensagem}`;
        window.location.href = `mailto:${ct.email}?subject=${encodeURIComponent(ct.assuntoEmail)}&body=${encodeURIComponent(corpo)}`;
        $("#form-ok").textContent = ct.mensagemSucesso;
      } else {
        $("#form-ok").textContent = T.obrigado(nome, email);
      }
      form.reset();
      regras.forEach((r) => document.getElementById(r.id).removeAttribute("aria-invalid"));
    });

    /* ---------- Faixa de campanha com contagem regressiva ---------- */
    const aviso = $("#aviso");
    const cp = CONFIG.campanha;
    if (cp && cp.ativa) {
      const [ano, mes, dia] = cp.data.split("-").map(Number);
      const hoje = new Date();
      const diaCampanha = new Date(ano, mes - 1, dia);
      const dias = Math.round((diaCampanha - new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate())) / 86400000);
      if (dias >= 0) {
        $("#aviso-selo").textContent = cp.selo;
        $("#aviso-texto").textContent = dias > 1 ? cp.texto.replace("{dias}", dias) : dias === 1 ? cp.textoUmDia : cp.textoHoje;
        $("#aviso-sub").textContent = cp.sub;
        const linkAviso = $("#aviso-link");
        linkAviso.textContent = cp.link;
        linkAviso.href = `https://wa.me/${digitosWhats}?text=${encodeURIComponent(cp.mensagemWhatsApp)}`;
        linkAviso.target = "_blank";
        linkAviso.rel = "noopener noreferrer";
        aviso.hidden = false;
      }
    }
    function medirAviso() {
      document.documentElement.style.setProperty("--altura-aviso", aviso.hidden ? "0px" : `${aviso.offsetHeight}px`);
    }
    medirAviso();
    window.addEventListener("resize", medirAviso);

    /* ---------- Rodapé ---------- */
    $("#redes").innerHTML = CONFIG.redes
      .map((r) => `<li><a href="${esc(r.link)}" target="_blank" rel="noopener noreferrer">${esc(r.nome)}<span class="visualmente-oculto"> ${T.novaAba}</span></a></li>`).join("");
    $("#direitos").textContent = `© ${new Date().getFullYear()} ${NOME}. ${T.direitos}`;

    /* ---------- Menu: fundo ao rolar e menu-sanduíche ---------- */
    const topo = $("#topo");
    const menuBtn = $("#menu-btn");
    const menu = $("#menu");

    function aoRolar() { topo.classList.toggle("rolado", window.scrollY > 20); }
    window.addEventListener("scroll", aoRolar, { passive: true });
    aoRolar();

    function abrirMenu(abrir) {
      menuBtn.setAttribute("aria-expanded", String(abrir));
      menuBtn.setAttribute("aria-label", abrir ? T.fecharMenu : T.abrirMenu);
      menu.classList.toggle("aberto", abrir);
      topo.classList.toggle("menu-aberto", abrir);
    }
    menuBtn.addEventListener("click", () => abrirMenu(menuBtn.getAttribute("aria-expanded") !== "true"));
    menu.addEventListener("click", (e) => { if (e.target.closest("a")) abrirMenu(false); });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && menu.classList.contains("aberto")) { abrirMenu(false); menuBtn.focus(); }
    });
    window.addEventListener("resize", () => { if (window.innerWidth > 880) abrirMenu(false); });

    /* ---------- Animações de entrada (IntersectionObserver) ---------- */
    const elementosReveal = document.querySelectorAll(".reveal");
    const numerosContador = document.querySelectorAll(".contador-num");

    if ("IntersectionObserver" in window && !reduzirMovimento) {
      const observador = new IntersectionObserver((entradas) => {
        entradas.forEach((entrada) => {
          if (entrada.isIntersecting) {
            entrada.target.classList.add("visivel");
            observador.unobserve(entrada.target);
          }
        });
      }, { threshold: 0.12, rootMargin: "0px 0px -40px 0px" });
      elementosReveal.forEach((el) => observador.observe(el));

      const observadorNumeros = new IntersectionObserver((entradas) => {
        entradas.forEach((entrada) => {
          if (entrada.isIntersecting) {
            animarContador(entrada.target);
            observadorNumeros.unobserve(entrada.target);
          }
        });
      }, { threshold: 0.6 });
      numerosContador.forEach((el) => observadorNumeros.observe(el));
    } else {
      elementosReveal.forEach((el) => el.classList.add("visivel"));
      numerosContador.forEach((el) => { el.textContent = formatar(parseFloat(el.dataset.valor), parseInt(el.dataset.casas, 10)); });
    }
  </script>
</body>
</html>
