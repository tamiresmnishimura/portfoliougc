<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- EDITE AQUI: título e descrição que aparecem no Google e quando o link
       é compartilhado no WhatsApp, Instagram ou LinkedIn. -->
  <title>Tamires Nishimura | Criadora de conteúdo UGC</title>
  <meta name="description" content="Portfólio de Tamires Nishimura, criadora de conteúdo UGC: mais de 90 vídeos autênticos para mais de 80 marcas de moda, beleza, gastronomia, casa, viagens e muito mais.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:url" content="https://tamiresmnishimura.github.io/portfoliougc/">
  <meta property="og:title" content="Tamires Nishimura | Criadora de conteúdo UGC">
  <meta property="og:description" content="Vídeos autênticos que fazem marcas pararem o scroll, gerarem confiança e venderem mais.">
  <meta property="og:image" content="https://tamiresmnishimura.github.io/portfoliougc/fotos/sobre.jpg">
  <meta name="theme-color" content="#f3eee9">

  <!-- Ícone da aba do navegador: estrela dourada -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f5efe9'/%3E%3Cpath d='M32 7C34 25 39 30 57 32C39 34 34 39 32 57C30 39 25 34 7 32C25 30 30 25 32 7Z' fill='%23c9a15e'/%3E%3C/svg%3E">

  <!-- Aplica a cor do site antes de desenhar a página (evita piscar a outra cor) -->
  <script>
    (function () {
      var t = new URLSearchParams(location.search).get("tema");
      if (t !== "azul") document.documentElement.dataset.tema = "bordo";
    })();
  </script>

  <!-- Fontes do Google: Fraunces (títulos) e Plus Jakarta Sans (textos) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       CORES E MEDIDAS DO SITE
       Troque os valores abaixo para mudar a paleta inteira.
       ========================================================= */
    :root {
      --creme: #f3eee9;
      --creme-escuro: #e9e1d8;
      --branco: #fffdfa;
      --tinta: #14110d;
      --tinta-suave: #4a433b;
      --azul: #0049a4;
      --azul-escuro: #00387f;
      --laranja: #df7900;
      --pessego: #ffd29a;
      --linha: rgba(20, 17, 13, .12);
      --raio: 14px;
      --sombra: 0 18px 40px -22px rgba(20, 17, 13, .35);
      --sombra-leve: 0 8px 24px -16px rgba(20, 17, 13, .3);
      --altura-menu: 72px;
      --altura-aviso: 0px;
      --altura-topo: calc(var(--altura-menu) + var(--altura-aviso));
      --foco: var(--azul);
    }

    /* =========================================================
       TEMA BORDÔ (mais sofisticado). Ativado por CONFIG.tema = "bordo"
       ou pelo endereço com ?tema=bordo. O azul vira bordô e o laranja,
       dourado champanhe.
       ========================================================= */
    :root[data-tema="bordo"] {
      --creme: #f5efe9;
      --creme-escuro: #ede3db;
      --branco: #fffcf9;
      --tinta: #1d1315;
      --tinta-suave: #4f4144;
      --azul: #6e1f30;
      --azul-escuro: #521622;
      --laranja: #b08d57;
      --pessego: #e8cfa4;
      --linha: rgba(29, 19, 21, .12);
    }
    :root[data-tema="bordo"] .titulo em,
    :root[data-tema="bordo"] .capa-nome em { font-weight: 300; }
    :root[data-tema="bordo"] .sobretitulo { letter-spacing: .24em; }
    :root[data-tema="bordo"] .btn-primario { box-shadow: inset 0 0 0 1px rgba(232, 207, 164, .35); }
    :root[data-tema="bordo"] .contato { background: linear-gradient(160deg, #6e1f30 0%, #4a1320 100%); }
    :root[data-tema="bordo"] .contato-icone { color: #6e1f30; }
    :root[data-tema="bordo"] .card-selo.ouro { background: var(--azul); color: #fff; }
    :root[data-tema="bordo"] .form-ok { background: #f4e6e8; }
    :root[data-tema="bordo"] .aviso { background: #6e1f30; color: #f5efe9; }
    :root[data-tema="bordo"] .aviso-selo { background: #f5efe9; color: #6e1f30; }
    :root[data-tema="bordo"] .aviso-link { color: #f1dcb4; }
    :root[data-tema="bordo"] .contador { border-top-color: var(--laranja); }
    :root[data-tema="bordo"] .resultado { background: linear-gradient(160deg, #2a1a1d 0%, #1d1315 100%); }

    *, *::before, *::after { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }
    html:has(dialog[open]) { overflow: hidden; }

    body {
      margin: 0;
      background: var(--creme);
      color: var(--tinta);
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 1.0625rem;
      line-height: 1.65;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    img { max-width: 100%; display: block; }

    h1, h2, h3 {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 400;
      line-height: 1.08;
      letter-spacing: -.02em;
      margin: 0;
      font-variation-settings: "opsz" 144;
    }

    p { margin: 0; }

    a { color: inherit; }

    :focus-visible {
      outline: 3px solid var(--foco);
      outline-offset: 3px;
      border-radius: 6px;
    }

    [hidden] { display: none !important; }

    .container {
      width: min(1200px, calc(100% - 2.5rem));
      margin-inline: auto;
    }

    .visualmente-oculto {
      position: absolute !important;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0);
      white-space: nowrap; border: 0;
    }

    /* Link "Pular para o conteúdo" (aparece só ao navegar pelo teclado) */
    .pular {
      position: absolute;
      left: 1rem; top: -100px;
      z-index: 100;
      background: var(--tinta);
      color: var(--creme);
      padding: .75rem 1.25rem;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
    }
    .pular:focus { top: 1rem; }

    /* =========================================================
       ELEMENTOS COMUNS
       ========================================================= */
    section {
      padding: clamp(2.25rem, 4.5vw, 3.5rem) 0;
      scroll-margin-top: calc(var(--altura-topo) - 1px);
    }

    .secao-topo {
      display: grid;
      gap: 1.1rem;
      max-width: 760px;
      margin-bottom: clamp(1.75rem, 3.5vw, 2.75rem);
    }

    .sobretitulo {
      display: inline-flex;
      align-items: center;
      gap: .8rem;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--azul);
    }
    .sobretitulo::before {
      content: "";
      width: 32px;
      height: 2px;
      background: var(--laranja);
      flex-shrink: 0;
    }

    .titulo {
      font-size: clamp(2.2rem, 5.5vw, 4rem);
    }
    .titulo em, .capa-nome em {
      font-style: italic;
      color: var(--azul);
      font-weight: 350;
    }

    .lead {
      font-size: clamp(1.05rem, 1.6vw, 1.2rem);
      color: var(--tinta-suave);
      max-width: 60ch;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .6rem;
      min-height: 50px;
      padding: .9rem 1.7rem;
      border-radius: 999px;
      border: 1.5px solid transparent;
      font: inherit;
      font-size: .95rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: transform .3s ease, background-color .3s ease, color .3s ease, border-color .3s ease;
    }
    .btn svg { width: 18px; height: 18px; transition: transform .3s ease; }
    .btn:hover svg { transform: translateX(3px); }
    .btn-primario { background: var(--azul); color: #fff; }
    .btn-primario:hover { background: var(--azul-escuro); transform: translateY(-2px); }
    .btn-secundario { border-color: var(--tinta); color: var(--tinta); background: transparent; }
    .btn-secundario:hover { background: var(--tinta); color: var(--creme); transform: translateY(-2px); }

    /* Blocos de imagem: foto real ou gradiente */
    .midia {
      position: relative;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background-size: cover;
      background-position: center;
    }
    div.midia::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(120% 70% at 15% 0%, rgba(255, 255, 255, .32), transparent 55%),
        radial-gradient(90% 60% at 100% 100%, rgba(20, 17, 13, .22), transparent 60%);
    }

    /* =========================================================
       1. MENU FIXO
       ========================================================= */
    .topo {
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 50;
      transition: background-color .35s ease, box-shadow .35s ease;
    }
    .topo.rolado, .topo.menu-aberto {
      background: rgba(243, 238, 233, .94);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      box-shadow: 0 1px 0 var(--linha);
    }

    .nav {
      height: var(--altura-menu);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .logo {
      font-family: "Fraunces", Georgia, serif;
      font-size: 1.45rem;
      font-style: italic;
      text-decoration: none;
      color: var(--tinta);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .logo span { color: var(--laranja); font-style: normal; }

    .menu {
      display: flex;
      align-items: center;
      gap: clamp(1.25rem, 2.5vw, 2.25rem);
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .menu a {
      position: relative;
      text-decoration: none;
      font-size: .93rem;
      font-weight: 500;
      color: var(--tinta);
      padding: .35rem 0;
    }
    .menu a:not(.menu-cta)::after {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 1.5px;
      background: var(--azul);
      transform: scaleX(0);
      transform-origin: right;
      transition: transform .35s ease;
    }
    .menu a:not(.menu-cta):hover::after { transform: scaleX(1); transform-origin: left; }
    .menu .menu-cta {
      border: 1.5px solid var(--tinta);
      border-radius: 999px;
      padding: .55rem 1.2rem;
      transition: background-color .3s ease, color .3s ease;
    }
    .menu .menu-cta:hover { background: var(--tinta); color: var(--creme); }

    /* Botões de idioma PT / EN */
    .nav-acoes { display: flex; align-items: center; gap: .5rem; flex-shrink: 0; }
    .idioma {
      display: inline-flex;
      padding: 3px;
      border: 1px solid var(--linha);
      border-radius: 999px;
      background: var(--branco);
    }
    .idioma button {
      font: inherit;
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .08em;
      min-width: 36px;
      min-height: 30px;
      padding: 0 .55rem;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--tinta-suave);
      cursor: pointer;
    }
    .idioma button[aria-pressed="true"] { background: var(--tinta); color: var(--creme); }

    /* Faixa de campanha no topo (Black Friday) */
    .aviso {
      background: #f2b705;
      color: var(--tinta);
      font-size: .8rem;
    }
    .aviso-conteudo {
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: .35rem .9rem;
      padding: .35rem 0;
      text-align: center;
    }
    .aviso-selo {
      background: var(--tinta);
      color: #f2b705;
      font-size: .66rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      padding: .25rem .6rem;
      border-radius: 999px;
    }
    .aviso-texto { font-weight: 700; }
    .aviso-sub { opacity: .85; }
    .aviso-link { font-weight: 700; color: var(--tinta); text-underline-offset: 3px; }
    .aviso-link:hover { text-decoration-thickness: 2px; }
    @media (max-width: 600px) {
      .logo { font-size: 1.12rem; }
      .idioma button { min-width: 32px; padding: 0 .4rem; }
    }
    @media (max-width: 700px) {
      .aviso-sub { display: none; }
      .aviso { font-size: .76rem; }
    }

    .menu-btn {
      display: none;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      width: 46px;
      height: 46px;
      padding: 0 11px;
      border: 0;
      background: transparent;
      cursor: pointer;
      flex-shrink: 0;
    }
    .menu-btn span {
      display: block;
      height: 2px;
      border-radius: 2px;
      background: var(--tinta);
      transition: transform .35s ease, opacity .25s ease;
    }
    .menu-btn[aria-expanded="true"] span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .menu-btn[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
    .menu-btn[aria-expanded="true"] span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    @media (max-width: 880px) {
      .menu-btn { display: flex; }
      .menu {
        position: fixed;
        top: var(--altura-topo);
        left: 0; right: 0;
        flex-direction: column;
        align-items: stretch;
        gap: 0;
        padding: .5rem 1.25rem 2rem;
        background: var(--creme);
        box-shadow: 0 24px 40px -24px rgba(20, 17, 13, .35);
        max-height: calc(100vh - var(--altura-topo));
        overflow-y: auto;
        opacity: 0;
        visibility: hidden;
        transform: translateY(-10px);
        transition: opacity .3s ease, transform .3s ease, visibility .3s;
      }
      .menu.aberto { opacity: 1; visibility: visible; transform: none; }
      .menu a {
        display: block;
        padding: 1rem 0;
        font-family: "Fraunces", Georgia, serif;
        font-size: 1.4rem;
        border-bottom: 1px solid var(--linha);
      }
      .menu a:not(.menu-cta)::after { display: none; }
      .menu .menu-cta {
        margin-top: 1.25rem;
        text-align: center;
        font-family: "Plus Jakarta Sans", sans-serif;
        font-size: 1rem;
        padding: .9rem 1.2rem;
      }
    }

    /* =========================================================
       1. CAPA
       ========================================================= */
    .capa {
      padding-top: calc(var(--altura-topo) + clamp(2rem, 6vw, 4.5rem));
      padding-bottom: 0;
    }

    .capa-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr);
      gap: clamp(2.5rem, 6vw, 5.5rem);
      align-items: center;
    }

    .capa-nome {
      font-size: clamp(3rem, 8.5vw, 7.2rem);
      line-height: .95;
      font-weight: 350;
      letter-spacing: -.035em;
      margin: 1.1rem 0 1.6rem;
      overflow-wrap: break-word;
    }

    .capa-frase {
      font-size: clamp(1.1rem, 2vw, 1.38rem);
      line-height: 1.55;
      color: var(--tinta-suave);
      max-width: 36ch;
    }

    .botoes {
      display: flex;
      flex-wrap: wrap;
      gap: .8rem;
      margin: 2.2rem 0 2.8rem;
    }

    .capa-numeros {
      display: grid;
      grid-template-columns: repeat(3, auto);
      justify-content: start;
      gap: clamp(1.5rem, 4vw, 3.5rem);
      list-style: none;
      margin: 0;
      padding: 1.8rem 0 0;
      border-top: 1px solid var(--linha);
    }
    .capa-numeros strong {
      display: block;
      font-family: "Fraunces", Georgia, serif;
      font-size: clamp(1.8rem, 3.6vw, 2.6rem);
      font-weight: 400;
      line-height: 1;
      margin-bottom: .35rem;
    }
    .capa-numeros span { font-size: .88rem; color: var(--tinta-suave); }

    .capa-foto {
      position: relative;
      max-width: 480px;
      justify-self: center;
      width: 100%;
    }
    /* A foto da capa já vem recortada, com o cartão e o contorno (fotos/capa.png) */
    .capa-foto img { width: 100%; height: auto; }
    .selo {
      position: absolute;
      left: -1.75rem;
      bottom: 3.5rem;
      display: flex;
      align-items: center;
      gap: .65rem;
      max-width: calc(100% - 1rem);
      padding: .85rem 1.15rem;
      background: var(--branco);
      border-radius: 12px;
      box-shadow: var(--sombra-leve);
      font-size: .86rem;
      font-weight: 600;
      line-height: 1.3;
    }
    .selo::before {
      content: "";
      width: 10px; height: 10px;
      flex-shrink: 0;
      border-radius: 50%;
      background: var(--laranja);
      animation: pulsar 2.4s ease-out infinite;
    }
    @keyframes pulsar {
      0% { box-shadow: 0 0 0 0 rgba(223, 121, 0, .5); }
      70% { box-shadow: 0 0 0 10px rgba(223, 121, 0, 0); }
      100% { box-shadow: 0 0 0 0 rgba(223, 121, 0, 0); }
    }

    /* Faixa de marcas */
    .faixa-marcas {
      margin-top: clamp(2.5rem, 5vw, 3.5rem);
      border-block: 1px solid var(--linha);
      padding: 1.3rem 0;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 1rem;
    }
    .faixa-rotulo {
      text-align: center;
      font-size: .74rem;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--tinta-suave);
      white-space: nowrap;
    }
    .faixa-trilho, .logos-linha {
      display: flex;
      overflow: hidden;
      min-width: 0;
      flex: 1;
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
      mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
    }
    .faixa-trilho ul {
      display: flex;
      align-items: center;
      flex-shrink: 0;
      gap: 1.1rem;
      padding: .2rem 1.1rem .2rem 0;
      margin: 0;
      list-style: none;
      animation: rolar 150s linear infinite;
    }
    .faixa-trilho:hover ul, .logos-linha:hover ul { animation-play-state: paused; }
    .faixa-trilho li {
      width: 92px; height: 92px;
      flex-shrink: 0;
      border-radius: 50%;
      background: var(--branco);
      border: 1px solid var(--linha);
    }
    .faixa-trilho img { width: 100%; height: 100%; object-fit: contain; padding: 11%; }
    @keyframes rolar { to { transform: translateX(-100%); } }

    /* =========================================================
       2. SOBRE MIM
       ========================================================= */
    .sobre-grid {
      display: grid;
      grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr);
      gap: clamp(2.5rem, 7vw, 6rem);
      align-items: center;
    }
    .sobre-foto { position: relative; }
    .sobre-foto .moldura {
      aspect-ratio: 4 / 5;
      border-radius: var(--raio);
      overflow: hidden;
      box-shadow: var(--sombra);
    }
    .sobre-etiqueta {
      position: absolute;
      right: -1rem;
      top: 2rem;
      background: var(--tinta);
      color: var(--creme);
      padding: .7rem 1.1rem;
      border-radius: 999px;
      font-size: .82rem;
      font-weight: 600;
      box-shadow: var(--sombra-leve);
      max-width: calc(100% - 1rem);
    }
    .sobre-texto { display: grid; gap: 1.25rem; }
    .sobre-texto .titulo { margin-bottom: .5rem; }
    .sobre-texto p { color: var(--tinta-suave); }
    .entregas-titulo {
      margin-top: 1rem;
      font-family: "Fraunces", Georgia, serif;
      font-size: 1.35rem;
      font-style: italic;
    }
    .entregas {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: .8rem 1.5rem;
    }
    .entregas li {
      display: flex;
      gap: .7rem;
      align-items: flex-start;
      font-size: .97rem;
      line-height: 1.45;
    }
    .entregas svg {
      width: 20px; height: 20px;
      flex-shrink: 0;
      margin-top: 1px;
      color: var(--azul);
    }
    .assinatura {
      margin-top: .75rem;
      font-family: "Fraunces", Georgia, serif;
      font-style: italic;
      font-size: 1.5rem;
      color: var(--tinta) !important;
    }
    .assinatura a {
      color: var(--azul);
      text-decoration: none;
      border-bottom: 1.5px solid currentColor;
      transition: color .3s ease;
    }
    .assinatura a span { display: inline-block; transition: transform .3s ease; }
    .assinatura a:hover span { transform: translateX(4px); }
    .sobre-texto strong { color: var(--tinta); font-weight: 700; }

    /* =========================================================
       3. CONTEÚDOS DE DESTAQUE
       ========================================================= */
    .destaques { background: var(--creme-escuro); }
    .destaques-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: clamp(1rem, 2vw, 1.75rem);
    }
    .card-video {
      display: block;
      text-decoration: none;
      color: inherit;
      border-radius: var(--raio);
    }
    .card-capa {
      position: relative;
      aspect-ratio: 9 / 16;
      border-radius: var(--raio);
      overflow: hidden;
      box-shadow: var(--sombra);
      background: var(--tinta);
    }
    .card-capa::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(20, 17, 13, .35) 0%, transparent 22%, transparent 70%, rgba(20, 17, 13, .35) 100%);
      pointer-events: none;
    }
    .card-capa .midia, .trabalho .midia { transition: transform .8s cubic-bezier(.2, .7, .2, 1); }
    .card-video:hover .card-capa .midia { transform: scale(1.045); }
    .card-selo {
      position: absolute;
      top: .8rem; left: .8rem;
      z-index: 2;
      max-width: calc(100% - 1.6rem);
      background: rgba(255, 253, 250, .94);
      color: var(--tinta);
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      line-height: 1.25;
      padding: .4rem .75rem;
      border-radius: 999px;
    }
    .card-selo.ouro { background: #ffd43b; color: var(--tinta); box-shadow: 0 4px 14px -6px rgba(20, 17, 13, .45); }
    .play {
      position: absolute;
      top: 50%; left: 50%;
      z-index: 2;
      width: 64px; height: 64px;
      transform: translate(-50%, -50%);
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(255, 253, 250, .94);
      color: var(--azul);
      box-shadow: 0 12px 30px -10px rgba(20, 17, 13, .5);
      transition: transform .4s ease, background-color .3s ease, color .3s ease;
    }
    .play svg { width: 22px; height: 22px; margin-left: 3px; }
    .card-video:hover .play { transform: translate(-50%, -50%) scale(1.08); background: var(--azul); color: #fff; }
    .card-numero {
      margin-top: 1.2rem;
      font-family: "Fraunces", Georgia, serif;
      font-size: clamp(1.9rem, 2.8vw, 2.6rem);
      line-height: 1;
      color: var(--azul);
      letter-spacing: -.03em;
    }
    .card-rotulo {
      margin-top: .4rem;
      font-size: .74rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--tinta-suave);
    }
    .card-titulo {
      margin-top: .9rem;
      font-size: 1.3rem;
      line-height: 1.2;
    }
    .card-titulo em { font-style: italic; color: var(--azul); }
    .card-contexto {
      margin-top: .4rem;
      font-size: .92rem;
      line-height: 1.5;
      color: var(--tinta-suave);
    }
    .deslize {
      display: none;
      margin-top: .5rem;
      font-size: .85rem;
      font-weight: 600;
      color: var(--tinta-suave);
    }

    @media (max-width: 1100px) {
      .destaques-grid {
        display: flex;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        scroll-padding-inline: 1.25rem;
        gap: 1.25rem;
        margin-inline: -1.25rem;
        padding: .25rem 1.25rem 1rem;
        scrollbar-width: none;
      }
      .destaques-grid::-webkit-scrollbar { display: none; }
      .destaques-grid .card-video { flex: 0 0 min(280px, 72%); scroll-snap-align: start; }
      .deslize { display: block; }
    }

    /* Carrossel dos destaques: vídeo do centro em evidência, vizinhos esmaecidos */
    .destaques-layout {
      display: grid;
      grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr);
      gap: clamp(2rem, 5vw, 4rem);
      align-items: center;
    }
    .destaques-texto { margin-bottom: 0; }
    .carrossel { position: relative; }
    .carrossel-palco {
      display: grid;
      justify-items: center;
      overflow: hidden;
      padding: .5rem 0 .5rem;
      touch-action: pan-y;
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent);
      mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent);
    }
    .slide {
      grid-area: 1 / 1;
      width: min(280px, 64vw);
      text-align: center;
      transform: translateX(calc(var(--d, 0) * 82%)) scale(.84);
      opacity: 0;
      pointer-events: none;
      transition: transform .6s cubic-bezier(.2, .7, .2, 1), opacity .6s ease;
      user-select: none;
    }
    .slide.vizinho { opacity: .38; pointer-events: auto; cursor: pointer; }
    .slide.ativo { opacity: 1; transform: translateX(0) scale(1); pointer-events: auto; z-index: 2; }
    .slide-marca {
      font-family: "Fraunces", Georgia, serif;
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      margin-bottom: .9rem;
    }
    .slide .card-capa { display: block; }
    .slide .card-capa img { -webkit-user-drag: none; }
    .slide.ativo .card-capa:hover .midia { transform: scale(1.04); }
    .slide.ativo .card-capa:hover .play { background: var(--azul); color: #fff; }
    .slide-dados { margin: 1.1rem 0 0; }
    .slide-dados div {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
      padding: .7rem 0;
      border-bottom: 1px solid var(--linha);
      text-align: left;
    }
    .slide-dados dt {
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--tinta-suave);
    }
    .slide-dados dd {
      margin: 0;
      font-family: "Fraunces", Georgia, serif;
      font-size: 1.6rem;
      line-height: 1;
      color: var(--azul);
      white-space: nowrap;
    }
    .slide-contexto { margin: .7rem -3rem 0; font-size: .84rem; line-height: 1.45; color: var(--tinta-suave); }
    .slide:not(.ativo) .slide-dados, .slide:not(.ativo) .slide-contexto { visibility: hidden; }
    .carrossel-seta {
      position: absolute;
      top: 42%;
      z-index: 3;
      width: 44px; height: 44px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 1px solid var(--linha);
      background: var(--branco);
      color: var(--tinta);
      box-shadow: var(--sombra-leve);
      cursor: pointer;
      transition: background-color .3s ease, color .3s ease;
    }
    .carrossel-seta svg { width: 20px; height: 20px; }
    .carrossel-seta:hover { background: var(--tinta); color: var(--creme); }
    .carrossel-seta.anterior { left: calc(50% - min(280px, 64vw) / 2 - 22px); }
    .carrossel-seta.proxima { right: calc(50% - min(280px, 64vw) / 2 - 22px); }
    .carrossel-pontos { display: flex; justify-content: center; gap: .5rem; margin-top: .5rem; }
    .ponto {
      width: 10px; height: 10px;
      padding: 0;
      border-radius: 999px;
      border: 0;
      background: rgba(20, 17, 13, .2);
      cursor: pointer;
      transition: width .3s ease, background-color .3s ease;
    }
    .ponto[aria-current="true"] { width: 26px; background: var(--azul); }
    @media (max-width: 880px) {
      .destaques-layout { grid-template-columns: minmax(0, 1fr); }
      .carrossel-palco { margin-inline: -1.25rem; }
    }

    /* =========================================================
       4. TRABALHOS POR NICHO
       ========================================================= */
    .filtros {
      display: flex;
      flex-wrap: wrap;
      gap: .6rem;
      margin-bottom: 2.5rem;
    }
    .filtro {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      font: inherit;
      font-size: .92rem;
      font-weight: 600;
      min-height: 44px;
      padding: .55rem 1.15rem;
      border-radius: 999px;
      border: 1.5px solid rgba(20, 17, 13, .25);
      background: transparent;
      color: var(--tinta);
      cursor: pointer;
      white-space: nowrap;
      transition: background-color .3s ease, color .3s ease, border-color .3s ease;
    }
    .filtro small { font-size: .75rem; font-weight: 600; opacity: .65; }
    .filtro:hover { border-color: var(--tinta); }
    .filtro[aria-pressed="true"] { background: var(--tinta); border-color: var(--tinta); color: var(--creme); }

    .galeria {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: clamp(1.25rem, 2.5vw, 2rem) clamp(1rem, 2vw, 1.5rem);
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .trabalho {
      display: block;
      text-decoration: none;
      color: inherit;
      border-radius: 12px;
    }
    .trabalho .moldura {
      position: relative;
      aspect-ratio: 9 / 16;
      border-radius: 12px;
      overflow: hidden;
      background: var(--creme-escuro);
      box-shadow: var(--sombra-leve);
    }
    .trabalho:hover .midia { transform: scale(1.05); }
    .mini-play {
      position: absolute;
      right: .65rem;
      bottom: .65rem;
      width: 38px; height: 38px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(255, 253, 250, .92);
      color: var(--azul);
      transition: background-color .3s ease, color .3s ease;
    }
    .mini-play svg { width: 14px; height: 14px; margin-left: 2px; }
    .trabalho:hover .mini-play { background: var(--azul); color: #fff; }
    .trabalho-legenda { padding-top: .8rem; }
    .trabalho-marca {
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--azul);
    }
    .trabalho-titulo {
      margin-top: .2rem;
      font-family: "Fraunces", Georgia, serif;
      font-size: 1.08rem;
      line-height: 1.25;
    }
    .trabalho.surgir { animation: surgir .6s cubic-bezier(.2, .7, .2, 1) both; }
    @keyframes surgir { from { opacity: 0; transform: translateY(14px); } }
    .mais { display: flex; justify-content: center; margin-top: 3rem; }
    @media (max-width: 1100px) { .galeria { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    /* Título de cada nicho dentro da galeria (quando mostra todos) */
    .galeria.em-linhas { grid-template-columns: minmax(0, 1fr); gap: clamp(2.5rem, 5vw, 3.5rem); }
    .nicho-linha { min-width: 0; }
    .nicho-trilho {
      list-style: none;
      margin: 1.25rem 0 0;
      padding: 0 0 .5rem;
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: calc((100% - 4 * 1.25rem) / 5);
      gap: 1.25rem;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }
    .nicho-trilho::-webkit-scrollbar { display: none; }
    .nicho-trilho > li { scroll-snap-align: start; }
    .nicho-setas { margin-left: auto; display: flex; gap: .5rem; align-self: center; }
    .nicho-seta {
      width: 42px; height: 42px;
      display: grid; place-items: center;
      border: 0;
      border-radius: 50%;
      background: var(--azul);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 8px 18px -10px rgba(20, 17, 13, .6);
      transition: background-color .3s ease, opacity .3s ease, transform .3s ease;
    }
    .nicho-seta svg { width: 20px; height: 20px; }
    .nicho-seta:hover:not(:disabled) { background: var(--azul-escuro); transform: scale(1.06); }
    .nicho-seta:disabled { opacity: .25; cursor: default; box-shadow: none; }
    @media (max-width: 1100px) { .nicho-trilho { grid-auto-columns: calc((100% - 3 * 1.25rem) / 4); } }
    @media (max-width: 700px) { .nicho-trilho { grid-auto-columns: 44%; gap: .85rem; } }
    .galeria-titulo {
      grid-column: 1 / -1;
      display: flex;
      align-items: baseline;
      gap: .8rem;
      padding-top: 1.5rem;
      border-bottom: 1px solid var(--linha);
      padding-bottom: .6rem;
    }
    .galeria-titulo:first-child { padding-top: 0; }
    .galeria-titulo h3 { font-size: clamp(1.6rem, 3vw, 2.2rem); font-style: italic; color: var(--azul); }
    .galeria-titulo span { font-size: .8rem; font-weight: 700; letter-spacing: .12em; color: var(--tinta-suave); }

    @media (max-width: 700px) {
      .filtros {
        flex-wrap: nowrap;
        overflow-x: auto;
        margin-inline: -1.25rem;
        padding: .25rem 1.25rem .5rem;
        scrollbar-width: none;
      }
      .filtros::-webkit-scrollbar { display: none; }
      .galeria { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.5rem .85rem; }
      .trabalho-titulo { font-size: 1rem; }
    }

    /* =========================================================
       4b. YOUTUBE E TIKTOK SHOP
       ========================================================= */
    .plataformas { background: var(--creme-escuro); }
    .plataforma {
      display: grid;
      grid-template-columns: minmax(0, .85fr) minmax(0, 1.15fr);
      gap: clamp(2rem, 5vw, 4.5rem);
      align-items: center;
    }
    .plataforma + .plataforma {
      margin-top: clamp(2.5rem, 5vw, 3.5rem);
      padding-top: clamp(2.5rem, 5vw, 3.5rem);
      border-top: 1px solid var(--linha);
    }
    .plataforma.tiktok { grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); }
    .plataforma-texto { display: grid; gap: 1.1rem; }
    .icone-yt { width: 1.1em; height: auto; vertical-align: -.08em; margin-left: .15em; }
    .plataforma-nota {
      font-family: "Fraunces", Georgia, serif;
      font-style: italic;
      font-size: 1.1rem;
      color: var(--azul);
    }
    .youtube-videos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.25rem; }
    @media (max-width: 600px) { .youtube-videos { grid-template-columns: minmax(0, 1fr); } }
    .video-longo { display: block; text-decoration: none; color: inherit; border-radius: var(--raio); }
    .video-longo .capa-16x9 {
      position: relative;
      aspect-ratio: 16 / 9;
      border-radius: var(--raio);
      overflow: hidden;
      box-shadow: var(--sombra);
      background: var(--tinta);
    }
    .video-longo .midia { transition: transform .8s cubic-bezier(.2, .7, .2, 1); }
    .video-longo:hover .midia { transform: scale(1.03); }
    .video-longo:hover .play { background: var(--azul); color: #fff; }
    .video-longo .card-selo { background: #ff0033; color: #fff; }
    .video-longo-legenda { display: flex; justify-content: space-between; gap: 1rem; align-items: baseline; padding-top: .9rem; }
    .video-longo-legenda strong { font-family: "Fraunces", Georgia, serif; font-weight: 400; font-size: 1.05rem; line-height: 1.3; }
    .video-longo-legenda span { font-size: .74rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--azul); white-space: nowrap; }

    .tiktok-card {
      background: var(--tinta);
      color: var(--creme);
      border-radius: calc(var(--raio) + 4px);
      padding: clamp(1.75rem, 4vw, 2.6rem);
      box-shadow: var(--sombra);
      display: grid;
      gap: 1.4rem;
    }
    .tiktok-topo { display: flex; align-items: center; gap: .8rem; }
    .tiktok-icone {
      width: 48px; height: 48px;
      display: grid; place-items: center;
      border-radius: 14px;
      background: linear-gradient(135deg, #25f4ee 0%, #fe2c55 100%);
      color: #fff;
    }
    .tiktok-icone svg { width: 24px; height: 24px; }
    .tiktok-selo { font-family: "Fraunces", Georgia, serif; font-size: 1.5rem; font-style: italic; }
    .tiktok-itens { list-style: none; margin: 0; padding: 0; display: grid; gap: .9rem; }
    .tiktok-itens li { display: flex; gap: .7rem; align-items: flex-start; line-height: 1.5; color: rgba(243, 238, 233, .9); }
    .tiktok-itens svg { width: 20px; height: 20px; flex-shrink: 0; margin-top: 2px; color: var(--laranja); }
    .btn-tiktok { justify-self: start; background: var(--creme); color: var(--tinta); }
    .btn-tiktok:hover { background: #fff; transform: translateY(-2px); }
    @media (max-width: 880px) {
      .plataforma, .plataforma.tiktok { grid-template-columns: minmax(0, 1fr); }
    }

    /* Player com vídeo horizontal (YouTube longo) */
    .player-video.horizontal {
      width: min(calc(100vw - 2.5rem), calc((100vh - 9rem) * 16 / 9), 980px);
      aspect-ratio: 16 / 9;
    }

    /* =========================================================
       5. COMO EU TE AJUDO
       ========================================================= */
    .servicos { background: var(--branco); }
    @media (max-width: 1000px) { .servicos-grid { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; } }
    @media (max-width: 600px) { .servicos-grid { grid-template-columns: minmax(0, 1fr) !important; } }
    .servicos-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(1rem, 2vw, 1.5rem);
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .servico {
      position: relative;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: .8rem;
      padding: clamp(1.75rem, 3vw, 2.4rem);
      background: var(--creme);
      border: 1px solid var(--linha);
      border-radius: var(--raio);
      overflow: hidden;
      transition: transform .4s ease, box-shadow .4s ease;
    }
    .servico::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--laranja);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform .5s ease;
    }
    .servico:hover { transform: translateY(-4px); box-shadow: var(--sombra); }
    .servico:hover::before { transform: scaleX(1); }
    .servico-numero {
      font-family: "Fraunces", Georgia, serif;
      font-style: italic;
      font-size: 1.6rem;
      color: var(--azul);
      line-height: 1;
    }
    .servico h3 { font-size: 1.6rem; }
    .servico p { color: var(--tinta-suave); font-size: .98rem; }
    .servico-detalhe {
      margin-top: auto;
      padding-top: 1rem;
      border-top: 1px solid var(--linha);
      font-size: .85rem;
      font-weight: 600;
      color: var(--tinta) !important;
    }

    /* =========================================================
       6. NÚMEROS E DEPOIMENTOS
       ========================================================= */
    .contadores {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(1.5rem, 3vw, 2.5rem);
      list-style: none;
      margin: 0 0 clamp(2.5rem, 5vw, 3.5rem);
      padding: 0;
    }
    .contador {
      border-top: 1.5px solid var(--tinta);
      padding-top: 1.25rem;
    }
    .contador-valor {
      display: block;
      font-family: "Fraunces", Georgia, serif;
      font-size: clamp(2.6rem, 5.5vw, 4.4rem);
      line-height: 1;
      letter-spacing: -.035em;
      font-variant-numeric: tabular-nums;
    }
    .contador-valor .sufixo { color: var(--azul); font-style: italic; }
    .contador-rotulo { display: block; margin-top: .6rem; font-size: .95rem; color: var(--tinta-suave); }

    .subtitulo {
      font-size: clamp(1.6rem, 3vw, 2.2rem);
      margin-bottom: 1.75rem;
    }
    .subtitulo em { font-style: italic; color: var(--azul); }

    /* Parede de logos (duas faixas em movimento) */
    .logos {
      display: grid;
      gap: 1.1rem;
      margin-bottom: clamp(2.5rem, 5vw, 3.5rem);
    }
    .logos-grade {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: clamp(.5rem, 1vw, .8rem);
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .logos-grade .logo-item { width: 100%; height: auto; aspect-ratio: 1; }
    .logos-grade .logo-item img { padding: 10%; }
    @media (max-width: 980px) { .logos-grade { grid-template-columns: repeat(8, minmax(0, 1fr)); } }
    @media (max-width: 600px) { .logos-grade { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    .logos-linha ul {
      display: flex;
      flex-shrink: 0;
      gap: 1.1rem;
      padding: .5rem 1.1rem .75rem 0;
      margin: 0;
      list-style: none;
      animation: rolar 170s linear infinite;
    }
    .logos-linha.reversa ul { animation-direction: reverse; }
    /* Bolinhas claras e iguais; a logo fica solta, sem fundo próprio (arquivos PNG transparentes) */
    .logo-item {
      width: 128px; height: 128px;
      flex-shrink: 0;
      border-radius: 50%;
      background: var(--branco);
      border: 1px solid var(--linha);
      box-shadow: 0 6px 18px -14px rgba(20, 17, 13, .45);
    }
    .logo-item img { width: 100%; height: 100%; object-fit: contain; padding: 12%; }
    .logo-texto {
      display: grid;
      place-items: center;
      padding: .8rem;
      text-align: center;
      font-family: "Fraunces", Georgia, serif;
      font-style: italic;
      font-size: .95rem;
      line-height: 1.12;
      color: var(--tinta);
    }

    .resultados {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(1rem, 2vw, 1.5rem);
      list-style: none;
      margin: 0 0 clamp(2.5rem, 5vw, 3.5rem);
      padding: 0;
    }
    .resultado {
      height: 100%;
      background: var(--tinta);
      color: var(--creme);
      border-radius: var(--raio);
      padding: clamp(1.75rem, 3vw, 2.4rem);
      display: flex;
      flex-direction: column;
      gap: .5rem;
    }
    .resultado-marca {
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: rgba(243, 238, 233, .75);
    }
    .resultado-metrica {
      margin-top: 1rem;
      font-family: "Fraunces", Georgia, serif;
      font-size: clamp(2.6rem, 4.5vw, 3.6rem);
      line-height: 1;
      color: var(--laranja);
      letter-spacing: -.03em;
    }
    .resultado-rotulo { font-weight: 600; }
    .resultado-descricao { font-size: .95rem; color: rgba(243, 238, 233, .8); }

    .depoimentos {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(1rem, 2vw, 1.5rem);
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .depoimento {
      height: 100%;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      padding: clamp(1.5rem, 2.5vw, 2rem);
      background: var(--branco);
      border: 1px solid var(--linha);
      border-radius: var(--raio);
      box-shadow: var(--sombra-leve);
    }
    .estrelas { color: var(--laranja); letter-spacing: .15em; font-size: .95rem; }
    .depoimento blockquote { margin: 0; }
    .depoimento blockquote p {
      font-family: "Fraunces", Georgia, serif;
      font-size: 1.1rem;
      line-height: 1.5;
    }
    .depoimento figcaption {
      margin-top: auto;
      display: flex;
      align-items: center;
      gap: .8rem;
      padding-top: 1rem;
      border-top: 1px solid var(--linha);
    }
    .avatar {
      width: 46px; height: 46px;
      flex-shrink: 0;
      border-radius: 50%;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: var(--azul);
      color: var(--creme);
      font-family: "Fraunces", Georgia, serif;
      font-style: italic;
      font-size: 1.2rem;
    }
    .avatar:has(img) { background: var(--branco); border: 1px solid var(--linha); }
    .avatar img { width: 100%; height: 100%; object-fit: contain; padding: 12%; }
    .depoimento-nome { display: block; font-weight: 700; font-size: .92rem; line-height: 1.35; }
    .depoimento-empresa { display: block; font-size: .85rem; color: var(--tinta-suave); }

    /* =========================================================
       7. BORA CRIAR JUNTOS (CONTATO)
       ========================================================= */
    .contato {
      --foco: var(--creme);
      background: var(--azul);
      color: var(--creme);
    }
    .contato .sobretitulo { color: var(--creme); }
    .contato .titulo em { color: var(--pessego); }
    .contato .lead { color: rgba(243, 238, 233, .88); }
    .contato-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: clamp(2.5rem, 6vw, 5rem);
      align-items: start;
    }
    .contato-info { display: grid; gap: 1.25rem; }
    .contato-links {
      display: grid;
      gap: .8rem;
      list-style: none;
      margin: 1.25rem 0 0;
      padding: 0;
    }
    .contato-link {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.2rem;
      border: 1px solid rgba(243, 238, 233, .3);
      border-radius: 12px;
      text-decoration: none;
      color: var(--creme);
      transition: background-color .3s ease, border-color .3s ease;
    }
    .contato-link:hover { background: rgba(243, 238, 233, .1); border-color: rgba(243, 238, 233, .6); }
    .contato-icone {
      width: 46px; height: 46px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--creme);
      color: var(--azul);
    }
    .contato-icone svg { width: 22px; height: 22px; }
    .contato-link small {
      display: block;
      font-size: .74rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: rgba(243, 238, 233, .8);
    }
    .contato-link strong { display: block; font-weight: 600; overflow-wrap: anywhere; }
    .contato-link > span:nth-child(2) { min-width: 0; }

    .formulario {
      --foco: var(--azul);
      background: var(--creme);
      color: var(--tinta);
      border-radius: calc(var(--raio) + 4px);
      padding: clamp(1.5rem, 4vw, 2.75rem);
      box-shadow: 0 30px 60px -30px rgba(0, 0, 0, .5);
      display: grid;
      gap: 1.2rem;
    }
    .formulario h3 { font-size: 1.7rem; }
    .campo { display: grid; gap: .45rem; }
    .campo label { font-size: .9rem; font-weight: 600; }
    .campo input, .campo textarea {
      width: 100%;
      font: inherit;
      font-size: 1rem;
      color: var(--tinta);
      background: var(--branco);
      border: 1.5px solid rgba(20, 17, 13, .2);
      border-radius: 10px;
      padding: .9rem 1rem;
      transition: border-color .25s ease, box-shadow .25s ease;
    }
    .campo textarea { min-height: 140px; resize: vertical; }
    .campo input:focus, .campo textarea:focus {
      outline: none;
      border-color: var(--azul);
      box-shadow: 0 0 0 3px rgba(0, 73, 164, .2);
    }
    .campo [aria-invalid="true"] { border-color: #b3261e; }
    .erro { font-size: .85rem; color: #b3261e; }
    .erro:empty { display: none; }
    .formulario .btn { width: 100%; }
    .form-ok {
      padding: 1rem 1.2rem;
      border-radius: 10px;
      background: #dfeafa;
      color: var(--azul-escuro);
      font-weight: 600;
      font-size: .95rem;
    }
    .form-ok:empty { display: none; }

    /* =========================================================
       8. RODAPÉ
       ========================================================= */
    .rodape {
      --foco: var(--laranja);
      background: var(--tinta);
      color: var(--creme);
      padding: clamp(3.5rem, 7vw, 5rem) 0 2rem;
    }
    .rodape-topo {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-end;
      gap: 2rem;
      padding-bottom: 2.5rem;
      border-bottom: 1px solid rgba(243, 238, 233, .15);
    }
    .rodape-nome {
      font-family: "Fraunces", Georgia, serif;
      font-size: clamp(2.2rem, 6vw, 3.8rem);
      line-height: 1;
      letter-spacing: -.03em;
    }
    .rodape-nome em { font-style: italic; color: var(--laranja); }
    .rodape-frase { margin-top: .75rem; color: rgba(243, 238, 233, .75); max-width: 40ch; }
    .redes {
      display: flex;
      flex-wrap: wrap;
      gap: .6rem;
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .redes a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: .55rem 1.1rem;
      border: 1px solid rgba(243, 238, 233, .3);
      border-radius: 999px;
      text-decoration: none;
      font-size: .9rem;
      transition: background-color .3s ease, color .3s ease;
    }
    .redes a:hover { background: var(--creme); color: var(--tinta); }
    .rodape-base {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 1rem;
      padding-top: 1.75rem;
      font-size: .85rem;
      color: rgba(243, 238, 233, .7);
    }
    .rodape-base a { color: var(--creme); }

    /* =========================================================
       PLAYER DE VÍDEO (abre por cima da página)
       ========================================================= */
    .player {
      --foco: var(--creme);
      border: 0;
      padding: 0;
      background: transparent;
      max-width: none;
      max-height: none;
      overflow: visible;
    }
    .player::backdrop { background: rgba(20, 17, 13, .88); }
    .player-caixa { position: relative; display: grid; gap: .85rem; justify-items: center; }
    .player-video {
      width: min(calc(100vw - 2.5rem), calc((100vh - 9rem) * 9 / 16), 420px);
      aspect-ratio: 9 / 16;
      border-radius: var(--raio);
      overflow: hidden;
      background: #000;
      box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .7);
    }
    .player-video iframe { width: 100%; height: 100%; border: 0; display: block; }
    .player-info {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: .4rem 1rem;
      color: var(--creme);
      font-size: .95rem;
      text-align: center;
    }
    .player-info strong { font-family: "Fraunces", Georgia, serif; font-weight: 400; font-size: 1.15rem; }
    .player-info a { color: var(--pessego); font-weight: 600; }
    .player-fechar {
      position: absolute;
      top: -.5rem;
      right: -3.5rem;
      width: 44px; height: 44px;
      border-radius: 50%;
      border: 0;
      background: var(--creme);
      color: var(--tinta);
      font-size: 1.6rem;
      line-height: 1;
      cursor: pointer;
    }
    @media (max-width: 600px) {
      .player-fechar { top: auto; bottom: -4rem; right: 50%; transform: translateX(50%); }
      .player-caixa { padding-bottom: 3.5rem; }
    }

    /* =========================================================
       ANIMAÇÃO DE ENTRADA AO ROLAR
       ========================================================= */
    .js .reveal {
      opacity: 0;
      transform: translateY(26px);
      transition: opacity .9s cubic-bezier(.2, .7, .2, 1), transform .9s cubic-bezier(.2, .7, .2, 1);
      transition-delay: var(--atraso, 0ms);
    }
    .js .reveal.visivel { opacity: 1; transform: none; }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .js .reveal { opacity: 1; transform: none; }
      .faixa-trilho ul[aria-hidden="true"], .logos-linha ul[aria-hidden="true"] { display: none; }
      .faixa-trilho ul, .logos-linha ul { flex-wrap: wrap; flex-shrink: 1; row-gap: .5rem; justify-content: center; }
      .faixa-trilho, .logos-linha { -webkit-mask-image: none; mask-image: none; }
    }

    /* =========================================================
       AJUSTES PARA TABLET E CELULAR
       ========================================================= */
    @media (max-width: 1100px) {
      .depoimentos { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 980px) {
      .contadores { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .resultados { grid-template-columns: minmax(0, 1fr); max-width: 640px; }
    }

    @media (max-width: 880px) {
      .capa-grid, .sobre-grid, .contato-grid { grid-template-columns: minmax(0, 1fr); }
      .capa-foto { max-width: 460px; width: calc(100% - 20px); }
      .sobre-foto { max-width: 460px; }
    }

    @media (max-width: 640px) {
      .depoimentos { grid-template-columns: minmax(0, 1fr); }
    }

    @media (max-width: 600px) {
      body { font-size: 1rem; }
      .capa-numeros { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; }
      .capa-numeros span { font-size: .8rem; display: block; line-height: 1.35; }
      .botoes .btn { flex: 1 1 100%; }
      .selo { left: .75rem; bottom: 1rem; }
      .sobre-etiqueta { right: .75rem; }
      .entregas { grid-template-columns: minmax(0, 1fr); }
      .contadores { gap: 2rem 1.25rem; }
      .logo-item { width: 104px; height: 104px; }
      .faixa-trilho li { width: 76px; height: 76px; }
      .logo-texto { font-size: .85rem; padding: .6rem; }
      .rodape-topo { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>

<body>
  <a class="pular" href="#conteudo" data-i18n="pular">Pular para o conteúdo</a>

  <!-- ============ MENU FIXO ============ -->
  <header class="topo" id="topo">
    <!-- Faixa de campanha (ex.: Black Friday). Configure em CONFIG.campanha. -->
    <div class="aviso" id="aviso" hidden>
      <div class="container aviso-conteudo">
        <span class="aviso-selo" id="aviso-selo"></span>
        <span class="aviso-texto" id="aviso-texto"></span>
        <span class="aviso-sub" id="aviso-sub"></span>
        <a class="aviso-link" id="aviso-link" href="#contato"></a>
      </div>
    </div>
    <nav class="nav container" aria-label="Navegação principal" data-i18n-aria="navPrincipal">
      <a href="#inicio" class="logo" id="logo"></a>
      <ul class="menu" id="menu">
        <li><a href="#sobre" data-i18n="menuSobre">Sobre</a></li>
        <li><a href="#destaques" data-i18n="menuDestaques">Destaques</a></li>
        <li><a href="#trabalhos" data-i18n="menuTrabalhos">Trabalhos</a></li>
        <li><a href="#servicos" data-i18n="menuServicos">Serviços</a></li>
        <li><a href="#numeros" data-i18n="menuNumeros">Números</a></li>
        <li><a href="#contato" class="menu-cta" data-i18n="menuContato">Contato</a></li>
      </ul>
      <div class="nav-acoes">
        <div class="idioma" role="group" aria-label="Idioma" data-i18n-aria="idioma">
          <button type="button" data-idioma="pt" lang="pt-BR">PT</button>
          <button type="button" data-idioma="en" lang="en">EN</button>
        </div>
        <button class="menu-btn" id="menu-btn" type="button" aria-expanded="false" aria-controls="menu" aria-label="Abrir menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </nav>
  </header>

  <main id="conteudo">
    <noscript><p class="container" style="padding-top:100px">Ative o JavaScript do navegador para ver o portfólio completo. / Please enable JavaScript to see the full portfolio.</p></noscript>

    <!-- ============ 1. CAPA ============ -->
    <section class="capa" id="inicio" aria-labelledby="capa-nome">
      <div class="container capa-grid">
        <div class="capa-texto">
          <p class="sobretitulo reveal" data-cfg="capa.sobretitulo"></p>
          <h1 class="capa-nome reveal" id="capa-nome" style="--atraso:80ms"></h1>
          <p class="capa-frase reveal" data-cfg="capa.frase" style="--atraso:160ms"></p>
          <div class="botoes reveal" style="--atraso:240ms">
            <a href="#contato" class="btn btn-primario"><span data-i18n="falarComigo">Falar comigo</span> <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
            <a href="#trabalhos" class="btn btn-secundario" data-i18n="verTrabalhos">Ver os trabalhos</a>
          </div>
          <ul class="capa-numeros reveal" id="capa-numeros" style="--atraso:320ms"></ul>
        </div>
        <div class="capa-foto reveal" style="--atraso:200ms">
          <div id="capa-midia"></div>
          <p class="selo" data-cfg="capa.selo"></p>
        </div>
      </div>

      <div class="faixa-marcas" aria-labelledby="faixa-rotulo">
        <p class="faixa-rotulo" id="faixa-rotulo" data-cfg="capa.rotuloMarcas"></p>
        <div class="faixa-trilho">
          <ul id="marcas"></ul>
          <ul id="marcas-copia" aria-hidden="true"></ul>
        </div>
      </div>
    </section>

    <!-- ============ 2. SOBRE MIM ============ -->
    <section class="sobre" id="sobre" aria-labelledby="sobre-titulo">
      <div class="container sobre-grid">
        <div class="sobre-foto reveal">
          <div class="moldura" id="sobre-midia"></div>
          <p class="sobre-etiqueta" data-cfg="sobre.etiqueta"></p>
        </div>
        <div class="sobre-texto">
          <p class="sobretitulo reveal" data-cfg="sobre.sobretitulo"></p>
          <h2 class="titulo reveal" id="sobre-titulo" data-cfg="sobre.titulo"></h2>
          <div id="sobre-paragrafos" style="display:grid;gap:1rem"></div>
          <p class="assinatura reveal" data-cfg="sobre.assinatura"></p>
        </div>
      </div>
    </section>

    <!-- ============ 3. CONTEÚDOS DE DESTAQUE ============ -->
    <section class="destaques" id="destaques" aria-labelledby="destaques-titulo">
      <div class="container destaques-layout">
        <div class="secao-topo destaques-texto">
          <p class="sobretitulo reveal" data-cfg="destaques.sobretitulo"></p>
          <h2 class="titulo reveal" id="destaques-titulo" data-cfg="destaques.titulo"></h2>
          <p class="lead reveal" data-cfg="destaques.descricao"></p>
        </div>
        <div class="carrossel reveal" id="carrossel" role="region" aria-roledescription="carrossel" aria-labelledby="destaques-titulo">
          <div class="carrossel-palco" id="carrossel-palco" aria-live="polite"></div>
          <button type="button" class="carrossel-seta anterior" id="carrossel-anterior" aria-label="Vídeo anterior" data-i18n-aria="anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
          <button type="button" class="carrossel-seta proxima" id="carrossel-proxima" aria-label="Próximo vídeo" data-i18n-aria="proximo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
          <div class="carrossel-pontos" id="carrossel-pontos"></div>
        </div>
      </div>
    </section>

    <!-- ============ 4. TRABALHOS POR NICHO ============ -->
    <section class="trabalhos" id="trabalhos" aria-labelledby="trabalhos-titulo">
      <div class="container">
        <div class="secao-topo">
          <p class="sobretitulo reveal" data-cfg="trabalhos.sobretitulo"></p>
          <h2 class="titulo reveal" id="trabalhos-titulo" data-cfg="trabalhos.titulo"></h2>
          <p class="lead reveal" id="trabalhos-descricao"></p>
        </div>
        <div class="filtros reveal" id="filtros" role="group" aria-label="Filtrar trabalhos por nicho" data-i18n-aria="filtrar"></div>
        <p class="visualmente-oculto" id="filtro-aviso" aria-live="polite"></p>
        <ul class="galeria" id="galeria"></ul>
        <div class="mais"><button type="button" class="btn btn-secundario" id="ver-mais"></button></div>
      </div>
    </section>

    <!-- ============ 4b. YOUTUBE E TIKTOK SHOP ============ -->
    <section class="plataformas" id="plataformas" aria-labelledby="youtube-titulo">
      <div class="container">
        <div class="plataforma">
          <div class="plataforma-texto">
            <p class="sobretitulo reveal" data-cfg="youtube.sobretitulo"></p>
            <h2 class="titulo reveal" id="youtube-titulo"><span data-cfg="youtube.titulo"></span> <svg class="icone-yt" viewBox="0 0 48 34" aria-hidden="true"><rect width="48" height="34" rx="9" fill="#ff0033"/><path d="M19 10v14l12-7z" fill="#fff"/></svg></h2>
            <p class="lead reveal" data-cfg="youtube.descricao"></p>
            <p class="plataforma-nota reveal" data-cfg="youtube.nota"></p>
          </div>
          <div class="youtube-videos reveal" id="youtube-videos"></div>
        </div>

        <div class="plataforma tiktok">
          <div class="plataforma-texto">
            <p class="sobretitulo reveal" data-cfg="tiktokShop.sobretitulo"></p>
            <h2 class="titulo reveal" id="tiktok-titulo" data-cfg="tiktokShop.titulo"></h2>
            <p class="lead reveal" data-cfg="tiktokShop.descricao"></p>
          </div>
          <div class="tiktok-card reveal">
            <div class="tiktok-topo">
              <span class="tiktok-icone" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 12H6.2L5 8Z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg></span>
              <span class="tiktok-selo">TikTok Shop</span>
            </div>
            <ul class="tiktok-itens" id="tiktok-itens"></ul>
            <a class="btn btn-tiktok" id="tiktok-link" target="_blank" rel="noopener noreferrer"></a>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ 5. COMO EU TE AJUDO ============ -->
    <section class="servicos" id="servicos" aria-labelledby="servicos-titulo">
      <div class="container">
        <div class="secao-topo">
          <p class="sobretitulo reveal" data-cfg="servicos.sobretitulo"></p>
          <h2 class="titulo reveal" id="servicos-titulo" data-cfg="servicos.titulo"></h2>
        </div>
        <ul class="servicos-grid" id="servicos-lista"></ul>
      </div>
    </section>

    <!-- ============ 6. NÚMEROS E DEPOIMENTOS ============ -->
    <section class="numeros" id="numeros" aria-labelledby="numeros-titulo">
      <div class="container">
        <div class="secao-topo">
          <p class="sobretitulo reveal" data-cfg="numeros.sobretitulo"></p>
          <h2 class="titulo reveal" id="numeros-titulo" data-cfg="numeros.titulo"></h2>
          <p class="lead reveal" data-cfg="numeros.descricao"></p>
        </div>
        <ul class="contadores" id="contadores"></ul>
        <h3 class="subtitulo reveal" id="logos-titulo" data-cfg="marcas.tituloLogos"></h3>
      </div>

      <div class="container logos reveal" role="region" aria-labelledby="logos-titulo">
        <ul class="logos-grade" id="logos-grade"></ul>
      </div>

      <div class="container">
        <h3 class="subtitulo reveal" data-cfg="numeros.depoimentosTitulo"></h3>
        <ul class="depoimentos" id="depoimentos"></ul>
        <div class="mais"><button type="button" class="btn btn-secundario" id="mais-depoimentos" hidden></button></div>
      </div>
    </section>

    <!-- ============ 7. BORA CRIAR JUNTOS ============ -->
    <section class="contato" id="contato" aria-labelledby="contato-titulo">
      <div class="container contato-grid">
        <div class="contato-info">
          <p class="sobretitulo reveal" data-cfg="contato.sobretitulo"></p>
          <h2 class="titulo reveal" id="contato-titulo" data-cfg="contato.titulo"></h2>
          <p class="lead reveal" data-cfg="contato.descricao"></p>
          <ul class="contato-links" id="contato-links"></ul>

    function mesclar(base, extra) {
      if (extra === undefined) return base;
      if (Array.isArray(base) && Array.isArray(extra)) return base.map((b, i) => (i < extra.length ? mesclar(b, extra[i]) : b));
      if (base && extra && typeof base === "object" && typeof extra === "object") {
        const r = { ...base };
        Object.keys(extra).forEach((k) => { r[k] = mesclar(base[k], extra[k]); });
        return r;
      }
      return extra;
    }

        if (d < -total / 2) d += total;

    }
